<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나에게 가장 발달한 감각은?</title>
<meta name="description" content="돈을 보는 감각? 사람을 읽는 감각? 유행을 발견하는 감각? 콘텐츠를 만드는 감각?">
<meta property="og:title" content="나에게 가장 발달한 감각은?">
<meta property="og:description" content="돈을 보는 감각? 사람을 읽는 감각? 유행을 발견하는 감각? 콘텐츠를 만드는 감각?">
<meta property="og:type" content="website">
<!-- <meta property="og:image" content="https://도메인/og.png"> 공유 썸네일 이미지 준비 시 추가 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">

  <!-- 1. 인트로 -->
  <section id="s-intro" class="screen active">
    <div class="hero">
      <p class="eyebrow">감각 심리테스트</p>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-subtitle"></p>
    </div>
    <button class="btn primary" id="btn-start"></button>
  </section>

  <!-- 2. 기본 정보 입력 -->
  <section id="s-info" class="screen">
    <h2>기본 정보를 알려주세요</h2>
    <form id="info-form" novalidate>
      <label class="field">
        <span>이름</span>
        <input id="f-name" type="text" maxlength="20" autocomplete="name" placeholder="이름 또는 닉네임">
      </label>

      <div class="field">
        <span>성별</span>
        <div class="seg" id="f-gender">
          <button type="button" data-v="여성">여성</button>
          <button type="button" data-v="남성">남성</button>
          <button type="button" data-v="상관없음">상관없음</button>
        </div>
      </div>

      <div class="field">
        <span>생년월일</span>
        <div class="dob">
          <select id="f-year" aria-label="년"></select>
          <select id="f-month" aria-label="월"></select>
          <select id="f-day" aria-label="일"></select>
        </div>
      </div>

      <div class="consent">
        <label class="check">
          <input type="checkbox" id="f-consent">
          <span>[필수] 개인정보 수집·이용에 동의합니다</span>
        </label>
        <details>
          <summary>내용 보기</summary>
          <dl>
            <dt>수집 항목</dt><dd id="p-items"></dd>
            <dt>이용 목적</dt><dd id="p-purpose"></dd>
            <dt>보유 기간</dt><dd id="p-period"></dd>
          </dl>
          <p class="muted">동의를 거부할 수 있으며, 거부 시 테스트 이용이 제한됩니다.</p>
        </details>
      </div>

      <p class="error" id="f-error" role="alert"></p>
      <button class="btn primary" type="submit">다음</button>
    </form>
  </section>

  <!-- 3. 질문 -->
  <section id="s-quiz" class="screen">
    <div class="progress"><div class="bar" id="q-bar"></div></div>
    <p class="count" id="q-count"></p>
    <h2 class="question" id="q-text"></h2>
    <div class="options" id="q-options"></div>
    <button class="link" id="btn-back" type="button">이전 질문</button>
  </section>

  <!-- 4. 분석 중 -->
  <section id="s-loading" class="screen">
    <div class="spinner" aria-hidden="true"></div>
    <p class="sub">결과를 분석하고 있어요</p>
  </section>

  <!-- 5. 결과 -->
  <section id="s-result" class="screen">
    <div class="profile" id="r-profile"></div>
    <p class="eyebrow">당신에게 가장 발달한 감각은</p>
    <h1 class="result-name" id="r-name"></h1>
    <p class="result-tagline" id="r-tagline"></p>
    <div class="chips" id="r-keywords"></div>
    <div class="card result-desc" id="r-desc"></div>
    <div id="r-sections"></div>
    <div class="card strength" id="r-strength"></div>
    <div class="cta-box">
      <p id="r-cta-text"></p>
      <a class="btn primary" id="btn-cta" target="_blank" rel="noopener"></a>
    </div>
    <p class="note" id="r-note"></p>
    <div class="actions">
      <button class="btn" id="btn-share" type="button">결과 공유하기</button>
      <button class="btn ghost" id="btn-retry" type="button">다시 하기</button>
    </div>
    <p class="toast" id="toast"></p>
  </section>

</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
