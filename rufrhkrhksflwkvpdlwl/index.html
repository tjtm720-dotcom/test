<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>응답 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap.wide { max-width: 1100px; }
  .login { max-width: 360px; margin: 20vh auto 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .bar-row { display: grid; grid-template-columns: 160px 1fr 130px; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
  .bar-row > span { white-space: nowrap; } .bar-row > span:last-child { text-align: right; }
  .bar-row .track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--accent); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar input, .toolbar select { width: auto; flex: 1 1 160px; padding: 10px; font-size: 14px; }
  .toolbar .btn { width: auto; padding: 10px 16px; font-size: 14px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--card); }
</style>
</head>
<body>
<main class="wrap wide">
  <section id="s-login" class="screen active">
    <form class="login" id="login">
      <h2>관리자 로그인</h2>
      <label class="field"><span>비밀번호</span><input type="password" id="pw" autocomplete="current-password" style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px"></label>
      <p class="error" id="err"></p>
      <button class="btn primary" type="submit">확인</button>
    </form>
  </section>

  <section id="s-dash" class="screen">
    <div class="toolbar" style="justify-content:space-between">
      <h2 style="margin:0">응답 관리</h2>
      <div style="display:flex;gap:8px">
        <button class="btn" id="reload" type="button">새로고침</button>
        <button class="btn primary" id="csv" type="button">CSV 다운로드</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel">
      <p class="eyebrow" style="margin-bottom:8px">결과 유형 분포 <span class="muted" style="font-weight:400">· 우측: 응답 수(비율) / CTA 클릭</span></p>
      <div id="dist"></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input id="q" type="search" placeholder="이름 검색">
        <select id="fr"><option value="">전체 결과</option></select>
        <select id="fg"><option value="">전체 성별</option><option>여성</option><option>남성</option><option>상관없음</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>일시</th><th>이름</th><th>성별</th><th>생년월일</th><th>결과</th><th>유입</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="muted" id="shown"></p>
    </div>
  </section>
</main>
<script src="/data.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const R = window.TEST_DATA.results;
  const rname = (k) => (R[k] ? R[k].name : k);
  let rows = [], cta = {}, password = "";

  Object.keys(R).forEach((k) => { const o = document.createElement("option"); o.value = k; o.textContent = R[k].name; $("fr").appendChild(o); });

  async function load() {
    const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }) });
    const j = await r.json().catch(() => ({ ok: false, error: "서버 응답 오류" }));
    if (!j.ok) throw new Error(j.error || "오류");
    rows = j.rows; cta = j.cta || {};
    render();
  }

  $("login").onsubmit = async (e) => {
    e.preventDefault();
    password = $("pw").value;
    $("err").textContent = "";
    try { await load(); $("s-login").classList.remove("active"); $("s-dash").classList.add("active"); }
    catch (err) { $("err").textContent = err.message; }
  };
  $("reload").onclick = () => load().catch((e) => alert(e.message));

  const fmt = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", hour12: false }); };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function filtered() {
    const q = $("q").value.trim(), fr = $("fr").value, fg = $("fg").value;
    return rows.filter((r) => (!q || r.name.includes(q)) && (!fr || r.result === fr) && (!fg || r.gender === fg));
  }

  function render() {
    const today = new Date().toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" });
    const todayN = rows.filter((r) => new Date(r.at).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" }) === today).length;
    const g = (v) => rows.filter((r) => r.gender === v).length;
    $("stats").innerHTML = [
      ["전체 응답", rows.length], ["오늘", todayN], ["여성", g("여성")], ["남성", g("남성")], ["상관없음", g("상관없음")],
      ["CTA 클릭", Object.values(cta).reduce((a, b) => a + b, 0)],
    ].map(([l, v]) => `<div class="stat"><b>${v.toLocaleString()}</b><span>${l}</span></div>`).join("");

    const cnt = {};
    rows.forEach((r) => (cnt[r.result] = (cnt[r.result] || 0) + 1));
    const max = Math.max(1, ...Object.values(cnt));
    $("dist").innerHTML = Object.keys(R).map((k) => {
      const n = cnt[k] || 0, pct = rows.length ? ((n / rows.length) * 100).toFixed(1) : "0.0";
      return `<div class="bar-row"><span>${esc(R[k].name)}</span><div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div><span>${n} (${pct}%) / ${cta[k] || 0}</span></div>`;
    }).join("");

    const list = filtered();
    $("tbody").innerHTML = list.slice(0, 1000).map((r) =>
      `<tr><td>${fmt(r.at)}</td><td>${esc(r.name)}</td><td>${esc(r.gender)}</td><td>${esc(r.birth)}</td><td>${esc(rname(r.result))}</td><td>${esc(r.ref)}</td></tr>`
    ).join("");
    $("shown").textContent = `${list.length.toLocaleString()}건` + (list.length > 1000 ? " 중 최근 1,000건 표시 (전체는 CSV)" : "");
  }
  ["q", "fr", "fg"].forEach((id) => $(id).addEventListener("input", render));

  $("csv").onclick = () => {
    const nq = window.TEST_DATA.questions.length;
    const head = ["일시", "이름", "성별", "생년월일", "결과", "유입", ...Array.from({ length: nq }, (_, i) => `Q${i + 1}`)];
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [head.map(cell).join(",")].concat(filtered().map((r) =>
      [fmt(r.at), r.name, r.gender, r.birth, rname(r.result), r.ref, ...Array.from({ length: nq }, (_, i) => (r.answers[i] ?? -1) + 1)].map(cell).join(",")
    ));
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `감각테스트-응답-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  };
})();
</script>
</body>
</html>
